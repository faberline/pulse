[package]
name="pulse-desktop"
version="0.3.0"
edition="2024"
rust-version="1.96"

[dependencies]
pulse-link={path="../pulse-link"}
pulse-core={path="../.."}
iced={version="0.14",features=["tokio","markdown","highlighter","image","svg"]}
serde_json="1"
serde={version="1",features=["derive"]}
uuid={version="1",features=["v4"]}
url="2"
libc="0.2"
image-codec={package="image",version="0.25",default-features=false,features=["png","jpeg"]}
pulldown-cmark="0.12"

[lints.rust]
unsafe_code="forbid"

[dev-dependencies]
tempfile="3"
