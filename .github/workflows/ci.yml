name: Pulse Rust and Swift
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component clippy,rustfmt,llvm-tools-preview
      - name: Record compiler
        run: rustc --version --verbose
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Swift desktop tests
        if: runner.os == 'macOS'
        run: swift test --package-path apps/pulse-desktop --scratch-path target/swift-desktop --enable-code-coverage
      - name: Save Swift coverage separately
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swift-desktop-coverage
          path: target/swift-desktop/**/codecov/*.json
          retention-days: 7
      - name: Build macOS desktop bundle (ad hoc signature)
        if: runner.os == 'macOS'
        run: sh scripts/build-macos-app.sh --debug
      - name: Computer helper process checks (no capture or permission request)
        if: runner.os == 'macOS'
        run: python3 scripts/check-computer-helper.py target/debug/Pulse.app/Contents/MacOS/pulse-computer target/debug/Pulse.app/Contents/MacOS/pulse-executor
      - name: Build owned computer fixture (no launch)
        if: runner.os == 'macOS'
        run: sh scripts/build-computer-fixture.sh
      - name: Fixture demonstration
        run: |
          cargo run --locked --example durable_demo -- "${RUNNER_TEMP}/pulse-demo.db"
          cargo run --locked --example durable_demo -- "${RUNNER_TEMP}/pulse-demo.db"
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup toolchain install 1.96.1 --profile minimal --component llvm-tools-preview
      - run: cargo install cargo-llvm-cov --version 0.8.5 --locked
      - name: Coverage report (all workspace source; no acceptance threshold)
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --locked --ignore-filename-regex '/(tests|examples)/' --lcov --output-path coverage/lcov.info
      - name: Coverage summary
        run: python3 scripts/coverage-summary.py coverage/lcov.info
      - name: Save coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-workspace-coverage
          path: coverage/lcov.info
          retention-days: 7
