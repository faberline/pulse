[workspace]
members = [".", "crates/pulse-link", "crates/pulse-macos"]
resolver = "3"

[package]
name = "pulse-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
description = "Durable, bounded task state for the Pulse personal agent"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
libc = "0.2"
ring = "0.17.14"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "sqlite-deserialize", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process"] }

[lints.rust]
unsafe_code = "forbid"
